name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Local engines
        run: |
          ./scripts/fetch-helpers.sh
          brew install --cask libreoffice
      - name: Tests
        env:
          FILEORBIT_QPDF: ${{ github.workspace }}/.build/vendor/qpdf/bin/qpdf
          FILEORBIT_RESVG: ${{ github.workspace }}/.build/vendor/resvg/resvg
          FILEORBIT_CWEBP: ${{ github.workspace }}/.build/vendor/cwebp/cwebp
        run: |
          python3 scripts/ci-tests.py
          python3 scripts/test-package-verifier.py
      - name: Build app archive
        run: ./scripts/build-app.sh
      - name: Verify packaged app
        run: python3 scripts/verify-package.py dist/FileOrbit-macOS-arm64.zip
      - name: Full Xcode app and intent metadata
        run: ./scripts/build-xcode-app.sh "$RUNNER_TEMP/fileorbit-xcode"
      - name: Compile SwiftUI preview scenes
        run: >-
          xcodebuild -project FileOrbit.xcodeproj -scheme FileOrbit
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/fileorbit-xcode"
          CODE_SIGNING_ALLOWED=NO build
      - name: Whitespace
        run: git diff --check
      - name: Preserve stalled-test stacks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fileorbit-test-stacks
          path: ${{ runner.temp }}/fileorbit-test-stacks
          if-no-files-found: ignore
